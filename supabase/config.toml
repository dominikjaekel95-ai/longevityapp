# Supabase-CLI-Konfiguration (Auszug). Projekt-Referenz wird mit `supabase link --project-ref <ref>` gesetzt.
project_id = "longvy"

[auth]
# E-Mail-Code statt Magic-Link: Die E-Mail-Vorlage „Magic Link“ muss {{ .Token }} enthalten (docs/SETUP.md).
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[functions.estimate-body]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
